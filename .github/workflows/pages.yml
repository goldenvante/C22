name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare Supabase env
        run: |
          node -e '
          const fs = require("fs");
          const rawUrl = process.env.EXPO_PUBLIC_SUPABASE_URL || "";
          const rawKey = process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || "";
          const clean = (s) => s.trim().replace(/^["\x27]+|["\x27]+$/g, "");
          let url = clean(rawUrl);
          const um = url.match(/https?:\/\/[^\s"\x27]+/);
          if (um) url = um[0];
          let key = clean(rawKey);
          const km = key.match(/(eyJ[\w.-]+|sb_[\w-]+)/);
          if (km) key = km[0];
          let msg = "";
          try {
            const u = new URL(url);
            if (u.protocol !== "https:") msg = "EXPO_PUBLIC_SUPABASE_URL no usa https.";
          } catch {
            msg = "EXPO_PUBLIC_SUPABASE_URL no es una URL valida.";
          }
          if (!msg && !(key.startsWith("eyJ") || key.startsWith("sb_"))) {
            msg = "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY no parece una publishable key (debe empezar por eyJ o sb_).";
          }
          if (msg) {
            console.log("::error::" + msg + " url_len=" + rawUrl.length + " key_len=" + rawKey.length);
            process.exit(1);
          }
          fs.writeFileSync(".env", "EXPO_PUBLIC_SUPABASE_URL=" + url + "\nEXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=" + key + "\n");
          if (url !== rawUrl || key !== rawKey) {
            console.log("::warning::El secret venia con espacios/comillas de mas; se normalizo en la build. Corrigelo en Settings -> Secrets and variables -> Actions.");
          }
          console.log("env OK url_len=" + url.length + " key_len=" + key.length + " (originales url_len=" + rawUrl.length + " key_len=" + rawKey.length + ")");
          '
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Export web
        run: npx expo export --platform web --output-dir dist-web 2>&1 | tee export.log
      - name: Fallback for deep links
        run: |
          ls -la dist-web
          cp dist-web/index.html dist-web/404.html
      - name: Report failure
        if: failure()
        run: |
          {
            echo "::error::Fallo un paso de la build web. dist-web: $(ls dist-web 2>&1 | tr '\n' ' ' | cut -c1-300) | export.log: $(tail -n 12 export.log 2>&1 | tr '\n' ' ' | cut -c1-600)"
            echo "### Diagnostico"
            echo '```'
            echo "dist-web:"; ls -la dist-web 2>&1 | tail -40
            echo "export.log (final):"; tail -n 60 export.log 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
