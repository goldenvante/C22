name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Supabase env
        run: |
          node -e '
          const url = process.env.EXPO_PUBLIC_SUPABASE_URL || "";
          const key = process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || "";
          let msg = "";
          if (!url) msg = "Falta el secret EXPO_PUBLIC_SUPABASE_URL.";
          else {
            try {
              const u = new URL(url);
              if (u.protocol !== "https:") msg = "EXPO_PUBLIC_SUPABASE_URL no usa https.";
            } catch {
              msg = "EXPO_PUBLIC_SUPABASE_URL no es una URL valida.";
            }
          }
          if (!msg && !key.startsWith("eyJ")) msg = "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY no parece JWT (debe empezar por eyJ).";
          if (msg) {
            console.log("::error::" + msg + " Pega en el secret SOLO el valor, sin nombre ni comillas. url_len=" + url.length + " key_len=" + key.length);
            process.exit(1);
          }
          console.log("env OK (url_len=" + url.length + " key_len=" + key.length + ", valores no impresos)");
          '
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Export web
        run: npx expo export --platform web --output-dir dist-web 2>&1 | tee export.log
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Fallback for deep links
        run: |
          ls -la dist-web
          cp dist-web/index.html dist-web/404.html
      - name: Report failure
        if: failure()
        run: |
          {
            echo "::error::Fallo un paso de la build web. dist-web: $(ls dist-web 2>&1 | tr '\n' ' ' | cut -c1-300) | export.log: $(tail -n 12 export.log 2>&1 | tr '\n' ' ' | cut -c1-600)"
            echo "### Diagnostico"
            echo '```'
            echo "dist-web:"; ls -la dist-web 2>&1 | tail -40
            echo "export.log (final):"; tail -n 60 export.log 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
